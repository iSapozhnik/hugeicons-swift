name: Release Hugeicons Refresh

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-hugeicons-refresh
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect whether this push updated Hugeicons
        id: changed
        run: |
          before_sha="${{ github.event.before }}"
          if [[ -z "${before_sha}" || "${before_sha}" == "0000000000000000000000000000000000000000" ]]; then
            before_sha="$(git rev-list --max-count=1 HEAD^ 2>/dev/null || true)"
          fi
          if [[ -z "${before_sha}" ]]; then
            echo "version_lock_changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if git diff --name-only "${before_sha}" HEAD | grep -x 'version.lock' >/dev/null; then
            echo "version_lock_changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "version_lock_changed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Exit when push is unrelated to Hugeicons updates
        if: steps.changed.outputs.version_lock_changed != 'true'
        run: echo "Push does not change version.lock; skipping release."

      - name: Determine previous and next repository versions
        if: steps.changed.outputs.version_lock_changed == 'true'
        id: repo_version
        run: |
          head_tag="$(git tag --points-at HEAD 'v*' | head -n 1)"
          previous_tag="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
          if [[ -n "${head_tag}" ]]; then
            next_tag="${head_tag}"
            should_release=false
          else
            next_tag="$(Scripts/ci/next_repo_version.sh "${previous_tag}")"
            should_release=true
          fi
          echo "head_tag=${head_tag}" >> "${GITHUB_OUTPUT}"
          echo "previous_tag=${previous_tag}" >> "${GITHUB_OUTPUT}"
          echo "next_tag=${next_tag}" >> "${GITHUB_OUTPUT}"
          echo "should_release=${should_release}" >> "${GITHUB_OUTPUT}"

      - name: Ensure release tag does not already exist
        if: steps.changed.outputs.version_lock_changed == 'true' && steps.repo_version.outputs.should_release == 'true'
        id: release_exists
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_TAG: ${{ steps.repo_version.outputs.next_tag }}
        run: |
          if gh release view "${NEXT_TAG}" >/dev/null 2>&1; then
            echo "create_release=false" >> "${GITHUB_OUTPUT}"
          else
            echo "create_release=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build release notes
        if: steps.changed.outputs.version_lock_changed == 'true' && steps.repo_version.outputs.should_release == 'true' && steps.release_exists.outputs.create_release == 'true'
        id: notes
        run: |
          temp_dir="$(mktemp -d)"
          cleanup() {
            rm -rf "${temp_dir}"
          }
          trap cleanup EXIT

          previous_tag="${{ steps.repo_version.outputs.previous_tag }}"
          if [[ -n "${previous_tag}" ]]; then
            git show "${previous_tag}:version.lock" > "${temp_dir}/previous-version.lock"
            git show "${previous_tag}:Sources/Hugeicons/Resources/Hugeicons/name-map.json" > "${temp_dir}/previous-name-map.json"
          fi

          current_upstream="$(Scripts/ci/read_version_lock.sh version.lock)"
          previous_upstream="none"
          if [[ -f "${temp_dir}/previous-version.lock" ]]; then
            previous_upstream="$(Scripts/ci/read_version_lock.sh "${temp_dir}/previous-version.lock")"
          fi

          Scripts/icons/summarize_hugeicons_name_map.swift \
            "${temp_dir}/previous-name-map.json" \
            Sources/Hugeicons/Resources/Hugeicons/name-map.json \
            --format markdown > "${temp_dir}/summary.md"

          cat > release-notes.md <<EOF
          Upstream Hugeicons package: \`${previous_upstream}\` -> \`${current_upstream}\`

          $(cat "${temp_dir}/summary.md")
          EOF

      - name: Create and push tag
        if: steps.changed.outputs.version_lock_changed == 'true' && steps.repo_version.outputs.should_release == 'true' && steps.release_exists.outputs.create_release == 'true'
        env:
          NEXT_TAG: ${{ steps.repo_version.outputs.next_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/${NEXT_TAG}" >/dev/null; then
            echo "Tag ${NEXT_TAG} already exists locally; reusing it."
          else
            git tag -a "${NEXT_TAG}" -m "${NEXT_TAG}"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${NEXT_TAG}" >/dev/null 2>&1; then
            echo "Tag ${NEXT_TAG} already exists on origin; skipping push."
          else
            git push origin "${NEXT_TAG}"
          fi

      - name: Create GitHub release
        if: steps.changed.outputs.version_lock_changed == 'true' && steps.repo_version.outputs.should_release == 'true' && steps.release_exists.outputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_TAG: ${{ steps.repo_version.outputs.next_tag }}
        run: |
          gh release create "${NEXT_TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${NEXT_TAG}" \
            --notes-file release-notes.md \
            --latest
